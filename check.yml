name: Comprobar Tranvia Murcia

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta automáticamente cada 5 minutos

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          IFTTT_URL: ${{ secrets.IFTTT_URL }}
        run: python tranvia.py
